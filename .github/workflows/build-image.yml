# Reusable: build a Docker image, push it to ghcr.io/marvinvr/<app>, optionally deploy via marvinvr/prod.
# Called from each app repo (see README.md). Public on purpose: public and private repos can both call it.
name: build-image

on:
  workflow_call:
    inputs:
      app:
        description: App name in marvinvr/prod (= ghcr.io/marvinvr/<app>)
        type: string
        required: true
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      deploy:
        description: Trigger marvinvr/prod deploy after the build (default branch only)
        type: boolean
        default: false
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      PROD_DEPLOY_TOKEN:
        required: false
    outputs:
      tag:
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      APP: ${{ inputs.app }}
    steps:
      - name: Validate input
        run: '[[ "$APP" =~ ^[a-z0-9-]+$ ]] || { echo "::error::invalid app name"; exit 1; }'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/marvinvr/${{ inputs.app }}:${{ steps.tag.outputs.tag }}
            ghcr.io/marvinvr/${{ inputs.app }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

      # workflow_dispatch instead of repository_dispatch: needs only Actions:write on
      # marvinvr/prod (repository_dispatch needs Contents:write = push to prod main).
      - name: Trigger deploy in marvinvr/prod
        if: inputs.deploy && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::PROD_DEPLOY_TOKEN is not set"; exit 1; }
          gh workflow run deploy.yml --repo marvinvr/prod --ref main -f "app=$APP" -f "tag=$TAG"
          echo "Deploy of $APP:$TAG triggered in marvinvr/prod" >> "$GITHUB_STEP_SUMMARY"
